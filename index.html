<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>re:code</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (기존 CSS 스타일은 동일하므로 생략하지만 실제 파일엔 그대로 두세요) */
        body { background-color: #ffffff; color: #1a1a1a; font-family: 'Courier New', monospace; padding: 20px; }
        #terminal { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; height: 80vh; margin-bottom: 20px; }
        .input-line { display: flex; border-top: 1px solid #eeeeee; padding-top: 10px; }
        input { border: none; outline: none; flex-grow: 1; font-family: inherit; font-size: inherit; }
    </style>
</head>
<body>

<div id="terminal">
[system] 365 days of breath.
[system] every word will be reset in a year.
</div>

<div class="input-line">
    <span class="prompt" id="prompt-text">ID:</span>
    <input type="text" id="user-input" autofocus autocomplete="off">
</div>

<script>
   // 1. 초기화 설정 (변수 이름을 _client로 바꿔서 충돌을 방지합니다)
const SUPABASE_URL = 'https://hufeqvmeehdplnddmnnx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tPLJ5u4HDXQrsEJej51VSQ_CQsgct_T';
// supabase.createClient 대신 아래처럼 선언해야 안전합니다.
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const terminal = document.getElementById('terminal');
const inputField = document.getElementById('user-input');
const promptText = document.getElementById('prompt-text');

let currentState = 'ID_INPUT'; 
let userId = '';

// 로그 출력 함수
function log(text) {
    const div = document.createElement('div');
    div.innerText = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

// 엔터 키 이벤트 리스너 (keypress 대신 keydown 사용이 더 정확합니다)
inputField.addEventListener('keydown', async (e) => {
    // 한글 입력 시 엔터가 두 번 입력되는 현상 방지
    if (e.isComposing) return; 

    if (e.key === 'Enter') {
        const value = inputField.value.trim();
        
        // 1. ID 입력 단계
        if (currentState === 'ID_INPUT') {
            if (!value) return; 
            userId = value;
            log("ID: " + userId);
            inputField.value = ""; 
            promptText.innerText = "PW:"; 
            currentState = 'PW_INPUT';
        } 
        
        // 2. PW 입력 단계
        else if (currentState === 'PW_INPUT') {
            log("PW: ********");
            inputField.value = "";
            inputField.disabled = true;

            // 3초 지연 연출
            log("\n[system] Searching for a soul...");
            await new Promise(r => setTimeout(r, 1000));
            log("[system] Bridging the gap to the memories...");
            await new Promise(r => setTimeout(r, 1000));
            log("[system] Connection established. Welcome.\n");
            
            promptText.innerText = "@" + userId + ":";
            currentState = 'LOGGED_IN';
            inputField.disabled = false;
            inputField.focus();
        } 
        
        // 3. 로그인 후 일기 작성 단계
        else if (currentState === 'LOGGED_IN') {
            if (!value) return;
            log(value);
            inputField.value = "";
            
            // DB 저장 실행 (변수명 수정됨)
            const { error } = await supabaseClient
                .from('entries')
                .insert([{ user_id: userId, content: value }]);
            
            if (error) console.error("저장 오류:", error);
        }
    }
});
</script>
</body>
</html>
